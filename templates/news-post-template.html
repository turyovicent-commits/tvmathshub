<!-- ============================================================
     TV MATHSHUB — NEWS POST TEMPLATE
     ============================================================
     
     HOW TO USE:
     1. Copy everything from "<div class="news-card"" to the closing "</div>"
     2. Paste it at the TOP of the news feed in index.html
        (right after: <div id="news-feed">)
     3. Edit: DATE, TITLE, DESCRIPTION, LINK, BUTTON TEXT, BORDER COLOR
     
     BORDER COLOR GUIDE:
     #1a237e (navy)   = General updates
     #f5c842 (yellow) = Announcements
     #10b981 (green)  = New products
     #7b1fa2 (purple) = Mock papers
     #c2185b (pink)   = Special offers
     #e53935 (red)    = Urgent
     
     EMOJI GUIDE:
     🎯 = Announcement
     📘 = New product
     🆕 = New addition
     📢 = Important
     🏆 = Success story
     📊 = Exam tip
     💡 = Tip
     
     RULE: Keep only 5 posts. Delete the oldest when adding new.
     ============================================================ -->

<div class="news-card" style="background: white; border-radius: 14px; padding: 22px 26px; margin-bottom: 18px; border-left: 5px solid #1a237e; box-shadow: 0 3px 12px rgba(0,0,0,0.06); transition: transform 0.2s;">
  <p style="color: #64748b; font-size: 0.85rem; margin: 0 0 6px 0;">📅 [DATE HERE]</p>
  <h3 style="color: #1a237e; margin: 0 0 10px 0; font-size: 1.2rem;">[TITLE HERE]</h3>
  <p style="color: #475569; margin: 0 0 14px 0; line-height: 1.7;">[DESCRIPTION HERE]</p>
  <a href="[LINK HERE]" style="color: #1a237e; font-weight: 700; text-decoration: none; font-size: 0.95rem;">[BUTTON TEXT] →</a>
</div>
